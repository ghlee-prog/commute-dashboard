<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>출근 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-white min-h-screen flex justify-center p-4">
    <div class="w-full max-w-md space-y-4">
        
        <!-- 시계 및 헤더 카드 -->
        <div class="bg-[#1e293b] p-5 rounded-2xl shadow-lg border border-slate-700/50">
            <div class="flex justify-between items-center text-slate-400 text-sm mb-1">
                <span id="current-date">--월 --일 (-)</span>
                <button onclick="location.reload()" class="hover:text-white"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
            <div id="current-time" class="text-4xl font-black tracking-tight my-1 text-white">00:00:00</div>
            <p class="text-xs text-slate-300 font-medium">오늘 하루도 힘내세요! 안전 운전하세요 🚗</p>
        </div>

        <!-- 단일 출근길 경로 카드 -->
        <div class="bg-[#1e293b] p-5 rounded-2xl shadow-lg border border-slate-700/50 space-y-4">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🚘</span>
                <h2 class="text-lg font-bold text-white">출근길 경로</h2>
            </div>

            <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-800 space-y-2">
                <div class="flex items-center space-x-2 text-sm">
                    <span class="bg-indigo-600/80 text-indigo-100 text-xs px-2 py-0.5 rounded font-bold">출발</span>
                    <span class="text-slate-200 font-medium">경기 광주시 더샵오포센트리체</span>
                </div>
                <div class="flex items-center space-x-2 text-sm">
                    <span class="bg-teal-600/80 text-teal-100 text-xs px-2 py-0.5 rounded font-bold">도착</span>
                    <span class="text-slate-200 font-medium">경기 안양시 안양메가밸리</span>
                </div>
            </div>

            <a href="nmap://route/car?slat=37.3663&slng=127.2255&sname=경기 광주시 더샵오포센트리체&dlat=37.3975&dlng=126.9688&dname=경기 안양시 안양메가밸리&appname=commute-dashboard"
               class="block w-full text-center py-3.5 bg-[#00c73c] hover:bg-[#00b035] text-white font-bold text-lg rounded-xl shadow-md transition-all">
                네이버 지도 앱으로 경로 열기
            </a>
        </div>

        <!-- 오늘 날씨 카드 -->
        <div class="bg-[#1e293b] p-5 rounded-2xl shadow-lg border border-slate-700/50 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">🌤️</span>
                    <h2 class="text-lg font-bold text-white">오늘 날씨 · 경기 광주시</h2>
                </div>
            </div>

            <div class="flex justify-between items-center py-2">
                <div>
                    <div class="text-4xl font-extrabold text-white">24°C</div>
                    <div class="text-xs text-slate-400 mt-1">구름 조금 · 체감 28°C</div>
                </div>
            </div>

            <a href="https://m.search.naver.com/search.naver?query=경기+광주시+날씨" 
               target="_blank"
               class="block w-full text-center py-3.5 bg-[#2563eb] hover:bg-[#1d4ed8] text-white font-bold text-lg rounded-xl shadow-md transition-all">
                네이버 날씨에서 상세 예보 보기
            </a>
        </div>

    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = days[now.getDay()];
            
            document.getElementById('current-date').innerText = `${month}월 ${date}일 (${day})`;
            document.getElementById('current-time').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
